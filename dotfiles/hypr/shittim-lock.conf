# Shittim HUD lock screen. PAM authentication uses the installed hyprlock defaults.
general {
    hide_cursor = true
}
animations {
    enabled = false
}
background {
    monitor =
    color = rgb(020f15)
}
label {
    monitor =
    text = S H I T T I M
    color = rgb(00d9f5)
    font_size = 28
    font_family = Hack Nerd Font Mono
    position = 0, 110
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    rounding = 0
    inner_color = rgb(041923)
    outer_color = rgb(00d9f5)
    font_color = rgb(d5f8ff)
    check_color = rgb(42e3b4)
    fail_color = rgb(ff637e)
    font_family = Hack Nerd Font Mono
    placeholder_text = AUTHENTICATE
    fail_text = RETRY
    fade_on_empty = false
    dots_size = 0.2
    position = 0, 0
    halign = center
    valign = center
}
